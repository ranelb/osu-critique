name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        extras: [""]
        include:
          # the web frontend is an optional extra, so it is installed on one
          # interpreter only: the core suite must stay dependency-free.
          - python-version: "3.14"
            extras: "[web]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]${{ matrix.extras }}"
      - name: Test
        run: pytest -q
