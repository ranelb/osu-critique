{% set rows = data.recent %}
<section class="panel" id="w-recent">
  <h2>Recently played <span class="count">{{ rows | length }}</span></h2>
  {% if not rows %}
    <p class="muted">Nothing yet.</p>
  {% else %}
  <div class="recent">
    {% for r in rows %}
    <a class="rrow" href="/run/{{ r.run_id }}">
      <img src="/api/cover/{{ r.beatmap_md5 }}?size=card" alt="" loading="lazy">
      <span class="t">{{ r.map }}</span>
      <span class="m">{{ r.mods }}</span>
      <span class="acc">{{ r.accuracy | pct }}</span>
      <span class="ur">{{ r.ur | num(1) }}</span>
      <span class="go">open</span>
    </a>
    {% endfor %}
  </div>
  {% endif %}
</section>
