<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="osu!critique">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{% block title %}osu-critique{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ff66aa'/></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">osu<span class="bang">!</span>critique</a>
  <nav class="nav">
    <a href="/">maps</a>
    <a href="/feed">feed</a>
    <a href="/ask">ask</a>
  </nav>
  <span class="ver">v{{ version }}</span>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block rail %}{% endblock %}
<div class="page">
{% block body %}{% endblock %}
</div>
</main>
<footer>
  Local analysis, your data. Not affiliated with ppy Pty Ltd — osu! is a
  registered trademark of Dean Herbert.
</footer>
{% block scripts %}{% endblock %}

</html>
