[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-critique"
version = "0.16.0"
description = "Data-driven osu! replay analysis: per-object hit/aim error, patterns, streams, tapping, UR — with deterministic reports and optional AI critique."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ran27" }]
keywords = ["osu", "replay", "analysis", "hit error", "unstable rate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.24",
    "slider==0.8.4",  # pinned: validated against this exact release
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
stars = ["rosu-pp-py>=2.0"]
# plain uvicorn on purpose: [standard] drags uvloop/httptools, which lag new
# CPython releases, and a local single-user server does not need them.
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1",
       "python-multipart>=0.0.9"]  # Form() parsing for the annotation forms
dev = ["pytest>=7.0", "httpx>=0.27"]  # httpx: fastapi's TestClient

[project.scripts]
osu-critique = "osu_critique.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# the wheel must carry the templates and the static files, or `osu-critique
# serve` breaks for everyone who installed from a wheel instead of a checkout.
[tool.setuptools.package-data]
osu_critique = [
    "export_assets.json",
    "web/templates/*.html",
    "web/templates/partials/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/*.md",
    "web/static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
